<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth.js (3D)</title>
    <link rel="icon" href="https://i.pinimg.com/originals/35/30/00/35300002fed76f25cadbd8eb924aba7e.png?nii=t"/>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(10, 15, 30, 0.75);
            padding: 14px 20px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 4px 0; font-size: 16px; letter-spacing: 1.2px; color: #61b5ff; }
        p { margin: 0; font-size: 12px; color: #ccc; }
        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            letter-spacing: 1px;
            font-weight: 500;
            transition: opacity 0.5s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loader">Загрузка планеты...</div>

    <div id="info">
        <h1>Earth Viewer 3D</h1>
        <p>Deployed in Github Pages</p>
    </div>

    <!-- Подключаем Three.js и OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Инициализация сцены
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 2.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        // Управление
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1.15;
        controls.maxDistance = 6;
        controls.rotateSpeed = 0.6;

        // Направленный свет (Солнце)
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        // Мягкий рассеянный свет, чтобы темная сторона не была абсолютно черной
        const ambientLight = new THREE.AmbientLight(0x222233, 0.8);
        scene.add(ambientLight);

        // Общая группа Земли с наклоном оси
        const earthGroup = new THREE.Group();
        earthGroup.rotation.z = 23.4 * Math.PI / 180;
        scene.add(earthGroup);

        // Загрузчик текстур с обработкой прогресса
        const textureLoader = new THREE.TextureLoader();
        
        // Ссылки на качественные текстуры из открытых источников
        const earthTextureURL = 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg';
        const bumpTextureURL = 'https://threejs.org/examples/textures/planets/earth_normal_2048.jpg';
        const cloudsTextureURL = 'https://threejs.org/examples/textures/planets/earth_clouds_1024.png';

        let loadedCount = 0;
        function checkLoaded() {
            loadedCount++;
            if (loadedCount === 3) {
                const loaderEl = document.getElementById('loader');
                loaderEl.style.opacity = '0';
                setTimeout(() => loaderEl.remove(), 500);
            }
        }

        const earthMap = textureLoader.load(earthTextureURL, checkLoaded);
        const bumpMap = textureLoader.load(bumpTextureURL, checkLoaded);
        const cloudsMap = textureLoader.load(cloudsTextureURL, checkLoaded);

        // 1. Поверхность Земли
        const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
        const earthMat = new THREE.MeshStandardMaterial({
            map: earthMap,
            bumpMap: bumpMap,
            bumpScale: 0.04,
            roughness: 0.6,
            metalness: 0.1
        });
        const earthMesh = new THREE.Mesh(sphereGeo, earthMat);
        earthGroup.add(earthMesh);

        // 2. Слой облаков (чуть больше радиус)
        const cloudsGeo = new THREE.SphereGeometry(1.012, 64, 64);
        const cloudsMat = new THREE.MeshStandardMaterial({
            map: cloudsMap,
            transparent: true,
            blending: THREE.NormalBlending,
            opacity: 0.85,
            depthWrite: false
        });
        const cloudsMesh = new THREE.Mesh(cloudsGeo, cloudsMat);
        earthGroup.add(cloudsMesh);

        // 3. Атмосферное свечение (ShaderMaterial для создания эффекта ореола Google Earth)
        const atmosGeo = new THREE.SphereGeometry(1.04, 64, 64);
        const atmosMat = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                void main() {
                    // Считаем интенсивность свечения по краям (эффект Френеля)
                    float intensity = pow(0.58 - dot(vNormal, vec3(0, 0, 1.0)), 2.5);
                    gl_FragColor = vec4(0.2, 0.5, 1.0, 1.0) * intensity * 1.4;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true,
            depthWrite: false
        });
        const atmosphere = new THREE.Mesh(atmosGeo, atmosMat);
        earthGroup.add(atmosphere);

        // 4. Реалистичное звездное небо
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 3000;
        const starPos = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 200;
            starPos[i+1] = (Math.random() - 0.5) * 200;
            starPos[i+2] = (Math.random() - 0.5) * 200;
        }

        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.8 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // Анимация вращения
        function animate() {
            requestAnimationFrame(animate);

            // Плавное вращение Земли и более быстрое движение облаков
            earthMesh.rotation.y += 0.0007;
            cloudsMesh.rotation.y += 0.0010;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Реакция на изменение размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
